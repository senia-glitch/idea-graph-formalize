[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ideagraph-formalize"
version = "0.1.0"
description = "Пакет-скилл: формализация веток графа в требования с критериями приёмки"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."ideagraph.packages"]
formalize = "ideagraph_formalize:manifest"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ideagraph_formalize = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
